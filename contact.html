<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwipeLeft - Contact</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app-content-wrapper">
    <nav>
        <a href="/" class="nav-brand">SwipeLeft</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about.html">About</a>
            <a href="/schedule.html">Schedule</a>
            <a href="/quran/">Quran</a>
            <a href="/khutbahs/">Sermon Library</a>
            <a href="/action/">Islam in Action</a>
        </div>
        <button id="theme-toggle">🌙</button>
    </nav>

    <div class="content" style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <h1>Contact Us</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">
            Have questions about resources, school meeting spaces, or want to get involved with the MSA at Normal Community High School? Send a message below.
        </p>
        
        <form action="https://formspree.io/f/xpqgvwbl" method="POST" style="display: flex; flex-direction: column; gap: 20px;">
            
            <input type="text" name="_gotcha" style="display:none">

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-weight: bold; font-size: 0.95rem;">Name</label>
                <input type="text" name="name" placeholder="Your Name" required 
                       style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box;">
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-weight: bold; font-size: 0.95rem;">Email Address</label>
                <input type="email" name="_replyto" placeholder="student@unit5.org" required 
                       style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box;">
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-weight: bold; font-size: 0.95rem;">Message</label>
                <textarea name="message" rows="5" placeholder="How can we help you?" required 
                          style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; font-family: inherit; resize: vertical;"></textarea>
            </div>
            
            <button type="submit" style="background-color: var(--islam-green); color: white; border: none; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background-color 0.2s;">
                Send Message
            </button>
        </form>
    </div>
</div>

<footer>
    © SwipeLeft
</footer>

<script>
    const themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
        themeToggle.addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
        });
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            themeToggle.textContent = '☀️';
        } else {
            document.body.classList.remove('dark-theme');
            themeToggle.textContent = '🌙';
        }
    }
</script>
</body>
</html>
