<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quran - Swipe Left</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        .quran-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .quran-container { grid-template-columns: 1fr; }
        }
        .controls-sidebar {
            background: var(--card-bg, #f9f9f9);
            padding: 20px;
            border-radius: 8px;
            height: fit-content;
            border: 1px solid #ddd;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .control-group select, .control-group input, .control-group button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: var(--bg-color, white);
            color: var(--text-color, #222);
            font-size: 1rem;
            cursor: pointer;
            box-sizing: border-box;
        }
        .nav-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
        }
        .size-controls {
            display: flex;
            gap: 10px;
        }
        .size-btn {
            background: #e0e0e0;
            color: #222 !important;
            font-weight: bold;
        }
        .toggle-btn {
            background: #e0e0e0;
            color: #222 !important;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .toggle-btn.active {
            background: #1b5e20 !important;
            color: white !important;
            border-color: #1b5e20;
        }
        .bookmark-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
        }
        .bookmark-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(0,0,0,0.04);
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .bookmark-item span {
            cursor: pointer;
            color: #1b5e20;
            font-weight: bold;
        }
        .bookmark-item button {
            width: auto;
            padding: 2px 6px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .reader-area {
            background: var(--card-bg, white);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #ddd;
            min-height: 400px;
        }
        .surah-header {
            text-align: center;
            border-bottom: 2px solid #1b5e20;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .bismillah {
            font-family: "Amiri Quran", serif;
            text-align: center;
            margin: 20px 0 40px 0;
            color: #1b5e20;
            direction: rtl;
        }
        .ayah-card {
            padding: 25px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: background-color 0.5s ease;
        }
        .arabic-text {
            line-height: 2.3;
            text-align: right;
            direction: rtl;
            font-weight: normal;
        }
        
        /* Premium Font Styles Override */
        .script-uthmani { 
            font-family: "Amiri Quran", "Scheherazade New", serif; 
        }
        .script-indopak { 
            font-family: "Scheherazade New", serif;
            font-weight: 700;
        }
        
        .translation-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted, #444);
        }
        .ayah-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: #888;
            align-items: center;
        }
        .action-link {
            color: #1b5e20;
            cursor: pointer;
            text-decoration: underline;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: #666;
            padding: 5px 0;
        }
    </style>
</head>
<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="../khutbahs/index.html">Khutbah Library</a>
    <a href="../guides/index.html">Teaching Guides</a>
    <a href="../action/index.html">Islam in Action</a>
    <a href="./index.html">Read Quran</a>
    <a href="../schedule.html">Schedule</a>
    
    <button id="theme-toggle">🌙</button>
</nav>

<div class="content">
    <h1>Interactive Quran Reader</h1>

    <div class="quran-container">
        <div class="controls-sidebar">
            <div class="control-group">
                <label>Navigate Location</label>
                <div class="nav-row">
                    <select id="surah-select"></select>
                    <input type="number" id="ayah-input" min="1" placeholder="Ayah" title="Type verse number and press enter">
                </div>
            </div>

            <div class="control-group">
                <label>Arabic Text Size</label>
                <div class="size-controls">
                    <button class="size-btn" onclick="adjustFontSize(-0.3)">A-</button>
                    <button class="size-btn" onclick="adjustFontSize(0.3)">A+</button>
                </div>
            </div>

            <div class="control-group">
                <label>Writing Script</label>
                <button id="script-toggle" class="toggle-btn active">Uthmani (Madina)</button>
            </div>

            <div class="control-group">
                <label>English Translation</label>
                <button id="translation-toggle" class="toggle-btn active">Show Translation</button>
            </div>

            <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">
            
            <h3>Bookmarks</h3>
            <ul id="bookmarks-container" class="bookmark-list"></ul>
        </div>

        <div class="reader-area">
            <div id="surah-title-area" class="surah-header">
                <h2>Select a chapter to begin loading</h2>
            </div>
            <div id="quran-display">
                <div class="loading">Please choose a Surah from the sidebar configuration menu.</div>
            </div>
        </div>
    </div>
</div>

<footer>
    © Swipe Left
</footer>

<script>
    // Configuration states
    let currentSurah = 1;
    let currentScript = 'uthmani'; 
    let showTranslation = true;
    let arabicFontSize = 2.4; // Base layout startup scale (larger defaults)
    let bookmarks = JSON.parse(localStorage.getItem('quran_bookmarks')) || [];

    // UI elements hooks
    const surahSelect = document.getElementById('surah-select');
    const ayahInput = document.getElementById('ayah-input');
    const scriptToggle = document.getElementById('script-toggle');
    const translationToggle = document.getElementById('translation-toggle');
    const quranDisplay = document.getElementById('quran-display');
    const surahTitleArea = document.getElementById('surah-title-area');
    const bookmarksContainer = document.getElementById('bookmarks-container');

    // 1. Theme Logic Integration
    const themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
        themeToggle.addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
        });
        // Sync setting safely at load
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            themeToggle.textContent = '☀️';
        }
    }

    // 2. Adjust Text Font Sizing Dynamically
    window.adjustFontSize = function(amount) {
        arabicFontSize = Math.max(1.5, Math.min(4.0, arabicFontSize + amount));
        const targets = document.querySelectorAll('.arabic-text');
        targets.forEach(el => el.style.fontSize = `${arabicFontSize}rem`);
        const bismillah = document.querySelector('.bismillah');
        if (bismillah) bismillah.style.fontSize = `${arabicFontSize - 0.2}rem`;
    };

    // 3. Populate Surah Dropdowns list automatically
    async function populateSurahList() {
        try {
            const res = await fetch('https://api.alquran.cloud/v1/surah');
            const data = await res.json();
            surahSelect.innerHTML = data.data.map(s => 
                `<option value="${s.number}">${s.number}. ${s.englishName} (${s.name})</option>`
            ).join('');
            
            surahSelect.value = currentSurah;
            loadSurahData();
        } catch (err) {
            quranDisplay.innerHTML = `<div class="loading" style="color:red">Failed to load the list of Surahs.</div>`;
        }
    }

    // 4. Main Fetch Controller Engine
    async function loadSurahData() {
        quranDisplay.innerHTML = '<div class="loading">Fetching verses from database...</div>';
        const arabicEdition = currentScript === 'uthmani' ? 'quran-uthmani' : 'quran-indopak';
        
        try {
            const responseArabic = await fetch(`https://api.alquran.cloud/v1/surah/${currentSurah}/${arabicEdition}`);
            const dataArabic = await responseArabic.json();
            
            let dataTranslation = null;
            if (showTranslation) {
                const responseTrans = await fetch(`https://api.alquran.cloud/v1/surah/${currentSurah}/en.sahih`);
                dataTranslation = await responseTrans.json();
            }

            renderSurah(dataArabic.data, dataTranslation ? dataTranslation.data : null);
        } catch (error) {
            quranDisplay.innerHTML = `<div class="loading" style="color:red">Error fetching Surah data.</div>`;
        }
    }

    // 5. Interface Generation rendering loop
    function renderSurah(arabicData, translationData) {
        surahTitleArea.innerHTML = `
            <h2>Surah ${arabicData.englishName}</h2>
            <p style="color: #666; margin: 5px 0 0 0;">${arabicData.englishNameTranslation} • ${arabicData.numberOfAyahs} Verses</p>
        `;

        let htmlContent = '';

        if (currentSurah != 1 && currentSurah != 9) {
            htmlContent += `<div class="bismillah" style="font-size: ${arabicFontSize - 0.2}rem">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
        }

        arabicData.ayahs.forEach((ayah, index) => {
            let cleanText = ayah.text;
            
            if (currentSurah != 1 && currentSurah != 9 && index === 0) {
                if (cleanText.startsWith("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ")) {
                    cleanText = cleanText.replace("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ", "");
                } else if (cleanText.startsWith("بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ ")) {
                    cleanText = cleanText.replace("بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ ", "");
                }
            }

            const fontClass = currentScript === 'uthmani' ? 'script-uthmani' : 'script-indopak';

            htmlContent += `
                <div class="ayah-card" id="ayah-${ayah.numberInSurah}">
                    <div class="arabic-text ${fontClass}" style="font-size: ${arabicFontSize}rem">${cleanText} <span style="color: #1b5e20; font-family: sans-serif; font-size: 1.4rem; font-weight: bold; vertical-align: middle;">﴿${ayah.numberInSurah}﴾</span></div>
                    ${showTranslation && translationData ? `<div class="translation-text">${translationData.ayahs[index].text}</div>` : ''}
                    <div class="ayah-meta">
                        <span>Ref: ${currentSurah}:${ayah.numberInSurah}</span>
                        <span class="action-link" onclick="addBookmark(${currentSurah}, ${ayah.numberInSurah}, '${arabicData.englishName}')">🔖 Bookmark</span>
                    </div>
                </div>
            `;
        });

        quranDisplay.innerHTML = htmlContent;
    }

    // 6. Direct Verse Jumper / Navigation logic
    async function jumpToAyah(ayahNum) {
        if (!ayahNum || ayahNum < 1) return;
        
        const targetElement = document.getElementById(`ayah-${ayahNum}`);
        if (targetElement) {
            targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetElement.style.backgroundColor = 'rgba(27, 94, 32, 0.15)';
            setTimeout(() => { targetElement.style.backgroundColor = 'transparent'; }, 2500);
        } else {
            alert(`Ayah ${ayahNum} not found in this Surah.`);
        }
    }

    ayahInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            jumpToAyah(parseInt(ayahInput.value));
        }
    });

    // 7. Bookmarks Array management controllers
    function renderBookmarks() {
        if (bookmarks.length === 0) {
            bookmarksContainer.innerHTML = '<li style="font-size:0.85rem; color:#888;">No saved verses yet.</li>';
            return;
        }
        bookmarksContainer.innerHTML = bookmarks.map((b, i) => `
            <li class="bookmark-item">
                <span onclick="goToBookmark(${b.surah}, ${b.ayah})">${b.name} [${b.surah}:${b.ayah}]</span>
                <button onclick="deleteBookmark(${i})">X</button>
            </li>
        `).join('');
    }

    window.addBookmark = function(surahNum, ayahNum, surahName) {
        const exists = bookmarks.some(b => b.surah === surahNum && b.ayah === ayahNum);
        if (!exists) {
            bookmarks.push({ surah: surahNum, ayah: ayahNum, name: surahName });
            localStorage.setItem('quran_bookmarks', JSON.stringify(bookmarks));
            renderBookmarks();
        }
    };

    window.deleteBookmark = function(index) {
        bookmarks.splice(index, 1);
        localStorage.setItem('quran_bookmarks', JSON.stringify(bookmarks));
        renderBookmarks();
    };

    window.goToBookmark = async function(surahNum, ayahNum) {
        if (currentSurah != surahNum) {
            currentSurah = surahNum;
            surahSelect.value = surahNum;
            await loadSurahData();
        }
        setTimeout(() => { jumpToAyah(ayahNum); }, 300);
    };

    // 8. Event Binding listeners
    surahSelect.addEventListener('change', (e) => {
        currentSurah = parseInt(e.target.value);
        ayahInput.value = ''; // Reset target container view index
        loadSurahData();
    });

    scriptToggle.addEventListener('click', () => {
        if (currentScript === 'uthmani') {
            currentScript = 'indopak';
            scriptToggle.textContent = 'Indo-Pak Script';
            scriptToggle.classList.remove('active');
        } else {
            currentScript = 'uthmani';
            scriptToggle.textContent = 'Uthmani (Madina)';
            scriptToggle.classList.add('active');
        }
        loadSurahData();
    });

    translationToggle.addEventListener('click', () => {
        showTranslation = !showTranslation;
        if (showTranslation) {
            translationToggle.textContent = 'Show Translation';
            translationToggle.classList.add('active');
        } else {
            translationToggle.textContent = 'Arabic Only';
            translationToggle.classList.remove('active');
        }
        loadSurahData();
    });

    // Fire application engines
    populateSurahList();
    renderBookmarks();
</script>

</body>
</html>
