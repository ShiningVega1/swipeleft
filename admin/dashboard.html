<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SwipeLeft</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .admin-header {
            background: var(--nav-bg);
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 12px 24px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .tab.active {
            background: var(--islam-green);
            color: white;
            border-color: var(--islam-green);
        }
        .admin-section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
        }
        button {
            background: var(--islam-green);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="app-content-wrapper">
    <nav>
        <a href="/" class="nav-brand">SwipeLeft Admin</a>
        <button id="theme-toggle">🌙</button>
        <button onclick="logout()" style="margin-left: auto; background: var(--nchs-red); color: white;">Logout</button>
    </nav>

    <div class="content">
        <h1>Admin Dashboard</h1>

        <div class="admin-header">
            <div class="tab active" onclick="showTab(0)">Schedule Events</div>
            <div class="tab" onclick="showTab(1)">Add Khutbah</div>
            <div class="tab" onclick="showTab(2)">Make Post</div>
        </div>

        <!-- Schedule -->
        <div class="admin-section active" id="tab0">
            <h2>Add New Event</h2>
            <form id="scheduleForm">
                <input type="text" id="eventDate" placeholder="Date (e.g. 8/28)" required>
                <input type="text" id="eventTopic" placeholder="Topic" required>
                <textarea id="eventDesc" placeholder="Description / Details" rows="4"></textarea>
                <button type="submit">Add to Schedule</button>
            </form>
        </div>

        <!-- Other tabs (placeholder for now) -->
        <div class="admin-section" id="tab1">
            <h2>Add New Khutbah</h2>
            <p>Coming soon...</p>
        </div>
        <div class="admin-section" id="tab2">
            <h2>Create Announcement</h2>
            <p>Coming soon...</p>
        </div>
    </div>
</div>

<footer>© SwipeLeft</footer>

<script src="/theme.js"></script>
<script>
    function showTab(n) {
        document.querySelectorAll('.admin-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        document.getElementById('tab' + n).classList.add('active');
        document.querySelectorAll('.tab')[n].classList.add('active');
    }

    function logout() {
        localStorage.removeItem('adminToken');
        window.location.href = '/admin/login.html';
    }

    document.getElementById('scheduleForm').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Event added successfully!');
        e.target.reset();
    });
</script>
</body>
</html>
