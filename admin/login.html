<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SwipeLeft</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .login-container {
            max-width: 420px;
            margin: 100px auto;
            padding: 50px 40px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }
        .login-container h1 {
            text-align: center;
            margin-bottom: 35px;
            color: var(--nchs-red);
            font-size: 2.2rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 16px;
            background: var(--islam-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #005522;
        }
        .error { 
            color: #ff3344; 
            text-align: center; 
            margin-top: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="app-content-wrapper">
    <nav>
        <a href="/" class="nav-brand">SwipeLeft</a>
        <button id="theme-toggle">🌙</button>
    </nav>

    <div class="login-container">
        <h1>Admin Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit">Login to Dashboard</button>
        </form>
        <div id="error" class="error"></div>
    </div>
</div>

<footer>© SwipeLeft</footer>

<script src="/theme.js"></script>
<script>
    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.textContent = '';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('https://billowing-silence-b38d.imranmuftee0.workers.dev/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (data.success) {
                localStorage.setItem('adminToken', data.token);
                window.location.href = '/admin/dashboard.html';
            } else {
                errorDiv.textContent = data.message || 'Invalid credentials';
            }
        } catch (err) {
            errorDiv.textContent = 'Connection error. Please try again.';
        }
    });
</script>
</body>
</html>
