<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SwipeLeft</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 120px auto;
            padding: 40px 30px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .login-container h1 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--nchs-red);
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--islam-green);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .error { color: #ff3344; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
<div class="app-content-wrapper">
    <nav>
        <a href="/" class="nav-brand">SwipeLeft</a>
        <button id="theme-toggle">🌙</button>
    </nav>

    <div class="login-container">
        <h1>Admin Login</h1>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required autocomplete="off">
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div id="error" class="error"></div>
    </div>
</div>

<footer>© SwipeLeft</footer>

<script src="/theme.js"></script>
<script>
    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('https://billowing-silence-b38d.imranmuftee0.workers.dev/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (data.success) {
                localStorage.setItem('adminToken', data.token);
                window.location.href = '/admin/dashboard.html';
            } else {
                errorDiv.textContent = data.message || 'Login failed';
            }
        } catch (err) {
            errorDiv.textContent = 'Connection error. Try again.';
        }
    });
</script>
</body>
</html>
